path = "src/bin/check_instances_json.rs"
test = false

# specs/004 T302:SurrealDB→E3D 写回 CLI(plan/apply/queue-apply)
[[bin]]
name = "e3d-writeback"
path = "src/bin/e3d_writeback.rs"
required-features = ["surrealdb"]
test = false

# specs/006 T201:E3D⇄DB 常驻同步守护(notify+静定窗+轮询兜底)
[[bin]]
name = "e3d-syncd"
path = "src/bin/e3d_syncd.rs"
required-features = ["surrealdb"]
test = false
