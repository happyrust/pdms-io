[package]
name = "pdms_io"
version = "0.1.0"
edition = "2024"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []                                 #
debug_parse = []
debug_btree_search = []                      # 启用B+树搜索调试输出
meilisearch = ["dep:meilisearch-sdk"]        # MeiliSearch 搜索引擎支持
surrealdb = ["dep:surrealdb", "dep:surrealdb-types"] # SurrealDB 数据库支持(types 供 SurrealValue 派生)
# sync-archive 需本地 `../dpc-sync` 依赖;该路径缺失会令 Cargo 清单解析失败、阻塞所有构建。
# 为支持默认构建(E3D 离线解码集成)暂移除 dpcsync;提供 ../dpc-sync 后,把下行恢复为
# `["dep:dpcsync", "dep:blake2"]` 并取消下方 dpcsync 依赖行的注释即可。
sync-archive = ["dep:blake2"] # 增量同步/克隆功能(dpcsync 暂缺,见上)

[dependencies]
anyhow = "1.0"
deku = "0.16.0"
memchr = "2.7.2"
aios_core = { path = "../rs-core", default-features = false }
# parse_pdms_db = { git = "https://github.com/happyrust/aios-parse-pdms" }
parse_pdms_db = { path = "crates/parse_pdms_db" }
# Fully-offline E3D/PDMS read+write decoder (std-only); re-exported as `pdms_io::e3d_decode`.
e3d_io = { path = "crates/e3d_io" }
nom = "8"
notify = "8.0.0"
futures = "0.3.28"
indexmap = "2.0.0"
walkdir = "2.3.3"
serde = "1.0.188"
tokio = { version = "1.32.0", features = ["full"] }
dashmap = "=7.0.0-rc2"
serde_json = "1.0.105"
chrono = "0.4.31"
surrealdb = { git = "https://github.com/happyrust/surrealdb", branch = "dev-3.1", default-features = false, optional = true, features = [
    "protocol-ws",
    "kv-mem",
] }
# SurrealValue derive 宏生成的代码引用 `::surrealdb_types` crate 路径,须作直接依赖(与 rs-core 同款;specs/003)
surrealdb-types = { git = "https://github.com/happyrust/surrealdb", branch = "dev-3.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rayon = "1.8.0"
# dpcsync = { path = "../dpc-sync", optional = true }  # 缺失:提供 ../dpc-sync 后取消注释 + 恢复 sync-archive 的 dep:dpcsync
blake2 = { version = "0.10.6", optional = true }
futures-util = "0.3.29"
log = "0.4.20"
atty = "0.2.14"
num_cpus = "1.16.0"
url = "2.4.1"
fern = "0.7.1"
derivative = "2.2.0"
itertools = "0.14.0"
flume = "0.11.0"
rand = "0.9.1"
iter_tools = "0.29.0"
meilisearch-sdk = { version = "0.28.0", optional = true }
glam = "0.30.9"
tempfile = "3"
rkyv = { version = "0.8.15", features = ["std", "bytecheck"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

# [patch."https://gitee.com/happydpc/rs-core.git"]


# [patch."https://gitee.com/happydpc/aios-parse-pdms.git"]
# parse_pdms_db = { path = "../aios-parse-pdms" }

# [patch."https://gitee.com/happydpc/rust-ploop-processor.git"]
# ploop-rs = { path = "../rust-ploop-processor/ploop-rs" }

# Binary targets that require meilisearch feature
[[bin]]
name = "pdms_io"
path = "src/main.rs"
test = false

[[bin]]
