[package]
name = "pdms_io"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = [] #
debug_parse = []

[dependencies]
anyhow = "1.0"
deku = "0.16.0"
memchr = "2.7.2"
aios_core = { git = "https://gitee.com/happydpc/rs-core"}
parse_pdms_db = { git = "https://gitee.com/happydpc/aios-parse-pdms" }
nom = "7.1.3"
notify = "8.0.0"
futures = "0.3.28"
indexmap = "2.0.0"
walkdir = "2.3.3"
serde = "1.0.188"
tokio = { version = "1.32.0", features = ["full"] }
dashmap = "6.1.0"
serde_json = "1.0.105"
chrono = "0.4.31"
surrealdb = { git = "https://gitee.com/happydpc/surrealdb", default-features = false, features = ["protocol-ws"]}
reqwest = { version = "0.11.22", default-features = false, features = ["json", "rustls-tls"] }
rayon = "1.8.0"
dpcsync = { git = "https://gitee.com/happydpc/dpc-sync" }
blake2 = "0.10.6"
futures-util = "0.3.29"
log = "0.4.20"
atty = "0.2.14"
num_cpus = "1.16.0"
url = "2.4.1"
fern = "0.7.1"
derivative = "2.2.0"
itertools = "0.14.0"
flume = "0.11.0"
rand = "0.9.1"
iter_tools = "0.29.0"
meilisearch-sdk = "0.28.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

[patch."https://gitee.com/happydpc/rs-core.git"]
aios_core = { path = "../new-crates/aios-core" }

[patch."https://gitee.com/happydpc/aios-parse-pdms.git"]
parse_pdms_db = { path = "../aios-parse-pdms" }

[patch."https://gitee.com/happydpc/surrealdb.git"]
surrealdb = { path = "../surrealdb/crates/sdk" }