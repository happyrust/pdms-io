[[bin]]
name = "test_get_refno_status"
path = "src/bin/test_get_refno_status.rs"
test = false

[[bin]]
name = "test_header_fix"
path = "src/bin/test_header_fix.rs"
test = false

[[bin]]
name = "test_increment_eles"
path = "src/bin/test_increment_eles.rs"
required-features = ["surrealdb"]
test = false

[[bin]]
name = "test_index_map"
path = "src/bin/test_index_map.rs"
test = false

[[bin]]
name = "test_meilisearch"
path = "src/bin/test_meilisearch.rs"
required-features = ["meilisearch", "surrealdb"]
