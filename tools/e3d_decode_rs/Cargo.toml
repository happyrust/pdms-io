[package]
name = "e3d_decode_rs"
version = "0.1.0"
edition = "2021"

# Standalone workspace: isolated from the parent pdms-io crate (which needs the
# missing `dpc-sync` path dependency and cannot build in this environment).
[workspace]

# Shared offline decoder (single source of truth); this CLI is now a thin consumer of it
# rather than carrying a duplicate decoder.
[dependencies]
e3d_io = { path = "../../crates/e3d_io" }

[[bin]]
name = "e3d_decode_rs"
path = "src/main.rs"
